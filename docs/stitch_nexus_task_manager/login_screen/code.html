<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        }

            background-color: #f7f9fb;
            background-image:

<body class="bg-mesh min-h-screen flex items-center justify-center font-body-md text-on-surface">
<main class="w-full max-w-[420px] px-container-margin py-2xl">
<div class="flex flex-col items-center mb-lg">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 mb-md">
<span class="material-symbols-outlined text-white text-3xl" data-icon="rocket_launch">rocket_launch</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface tracking-tighter">Orbit</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Professional high-focus workspace</p>
</div>
<div class="glass-card rounded-2xl p-lg shadow-xl shadow-slate-200/50">
<div class="space-y-sm mb-lg">
<h2 class="font-h2 text-h2 text-on-surface">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your details to sign in.</p>
</div>
<form class="space-y-md">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-xs ml-1" for="email">Email address</label>
<div class="relative">
<input class="w-full bg-white/50 border border-outline-variant rounded-xl py-3 px-md font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div>
<div class="flex justify-between items-center mb-xs ml-1">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full bg-white/50 border border-outline-variant rounded-xl py-3 px-md font-body-md text-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center gap-2 px-1">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="font-label-sm text-label-sm text-on-surface-variant" for="remember">Keep me signed in</label>
</div>
<button class="w-full bg-primary text-on-primary font-button text-button py-3.5 rounded-xl shadow-md shadow-primary/20 hover:bg-primary-container active:scale-[0.98] transition-all duration-200" type="submit">
                    Sign in to Workspace
                </button>
</form>
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>
</div>
<div class="relative flex justify-center text-label-sm">
<span class="bg-transparent px-md text-on-surface-variant font-label-sm">or continue with</span>
</div>
</div>
<button class="w-full flex items-center justify-center gap-3 bg-white border border-outline-variant rounded-xl py-3 px-md font-button text-button text-on-surface hover:bg-surface-container-low active:scale-[0.98] transition-all duration-200">
<svg height="20" viewbox="0 0 24 24" width="20">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</div>
<p class="mt-lg text-center font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="text-primary font-semibold hover:underline" href="#">Create account</a>
</p>
<footer class="mt-2xl flex justify-center gap-md text-label-sm text-on-surface-variant/60 font-label-sm">
<a class="hover:text-on-surface" href="#">Privacy Policy</a>
<span>•</span>
<a class="hover:text-on-surface" href="#">Terms of Service</a>
</footer>

<div class="fixed top-20 right-20 w-64 h-64 bg-primary/5 rounded-full blur-[80px] -z-10"></div>
<div class="fixed bottom-20 left-20 w-96 h-96 bg-tertiary-container/5 rounded-full blur-[100px] -z-10"></div>
