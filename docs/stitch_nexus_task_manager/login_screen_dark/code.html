<body class="bg-surface-container-lowest min-h-screen flex flex-col font-body-base text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Header Suppression Rule Applied: Transactional page logic hides global navigation shells -->
<main class="flex-grow flex items-center justify-center px-gutter py-xl relative overflow-hidden">
<!-- Background Aesthetic Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-500/10 rounded-full blur-[120px]"></div>

</div>

</div>
<!-- Login Card -->
<div class="glass-panel rounded-2xl p-xl shadow-2xl relative overflow-hidden">

<form class="space-y-lg relative z-10">
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-zinc-300 block ml-unit" for="email">Work Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-zinc-500 text-lg" data-icon="alternate_email">alternate_email</span>
<input class="w-full h-12 pl-12 pr-md rounded-lg input-recessed font-body-base text-zinc-50 placeholder:text-zinc-600" id="email" placeholder="name@studio.com" type="email"/>
</div>
</div>
<div class="space-y-sm">
<div class="flex justify-between items-center ml-unit">
<label class="font-label-sm text-label-sm text-zinc-300 block" for="password">Secret Key</label>
<a class="font-label-sm text-label-sm text-indigo-400 hover:text-indigo-300 transition-colors" href="#">Forgot Key?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-zinc-500 text-lg" data-icon="key">key</span>
<input class="w-full h-12 pl-12 pr-md rounded-lg input-recessed font-body-base text-zinc-50 placeholder:text-zinc-600" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center space-x-md ml-unit">
<div class="relative flex items-center">
<input class="peer h-5 w-5 rounded border-zinc-700 bg-zinc-900/50 text-indigo-400 focus:ring-indigo-400 focus:ring-offset-zinc-950" id="remember" type="checkbox"/>
</div>
<label class="font-label-sm text-label-sm text-zinc-400 select-none" for="remember">Remember this terminal</label>
</div>
<button class="w-full h-[48px] bg-indigo-400 hover:bg-indigo-300 active:scale-[0.98] text-zinc-950 font-semibold rounded-lg shadow-[0_4px_15px_rgba(129,140,248,0.25)] transition-all duration-200 flex items-center justify-center space-x-sm" type="submit">
<span class="font-body-base">Authenticate Access</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-xl">
<div class="flex-grow h-[1px] bg-zinc-800"></div>
<span class="px-md font-label-sm text-label-sm text-zinc-600">OR</span>

<img alt="" class="w-4 h-4 mr-sm" data-alt="minimalist white github octocat logo icon on transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXwfY76Y6Ro2km4R9Pq2EdD4tlN6i9f9lRlJ4kWaL6245jpBT2lX8PiS6g-raPO0oTU6Trbb8BEWKIsmjOgy-V-zpyC_RvzonzFgADFE6so3ksUc8hGdu8-lQbcqE6keVjZavcFyQQN8LN0u1VDfq1VLesCzl6uew8JEza5W1ooip085D2YGXtf4XJUVEvnPkVg9DmwOaUyKrOhQWCbAa_uoJLuYQgai7clpR1tTYB6wuUDwYYeiqWZk_N1xn3_XALL9aOxFG02g"/>
