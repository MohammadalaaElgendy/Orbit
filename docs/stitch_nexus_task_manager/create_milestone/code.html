<body class="bg-background text-on-surface font-body-md min-h-screen pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-b border-slate-200/50 dark:border-slate-800/50 shadow-sm flex justify-between items-center px-6 h-16 w-full">

</div>
<div class="h-8 w-8 rounded-full overflow-hidden bg-surface-container-high border border-outline-variant">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Portrait of a professional user in soft studio lighting with a neutral gray background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpd0OYqJMiZ2L-p4ORVY7XzpN22q9kep3i7EXF0kAqvCn9NZs5tza5IYHwSnFpn3Ndu6TlHOuFSM1cl2uE2XOyYWegJksQlMMHy7ii-emtFxUy6v9SycTv8yRDWKFfz_bnitxgoQUZXsLx2eBEByp4qmtfjhe12G9p76XWO_14BX9YKD0NdvPnMxNKrsQmK31tXYhcUOOTwwo-tYNs6ebi34oI-E87LZ-SFiKavZGUwnCLX4K0PNr7o4jL0w90A7VnUnan0TlU4A"/>
</div>
</header>
<!-- Main Content -->
<main class="pt-24 px-6 max-w-2xl mx-auto">
<!-- Breadcrumb / Header Section -->
<div class="mb-8">
<h2 class="font-h1 text-h1 text-on-surface">New Milestone</h2>
<p class="text-on-surface-variant font-body-md mt-1">Define an important achievement for your project.</p>
</div>
<!-- Form Container -->
<div class="glass-panel border border-white/40 shadow-xl rounded-3xl p-8 mb-12">
<form class="space-y-6">
<!-- Title Field -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-secondary block ml-2">Milestone Title</label>
<input class="w-full bg-surface-container-lowest border-outline-variant rounded-2xl px-5 py-4 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md outline-none" placeholder="e.g. Beta Release 1.0" type="text"/>
</div>
<!-- Description Field -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-secondary block ml-2">Description</label>
<textarea class="w-full bg-surface-container-lowest border-outline-variant rounded-2xl px-5 py-4 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md outline-none resize-none" placeholder="Describe the significance of this milestone..." rows="4"></textarea>
</div>
<!-- Grid for Project and Dates -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Project Selector -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-secondary block ml-2">Associated Project</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border-outline-variant rounded-2xl px-5 py-4 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md outline-none pr-10">
<option>Internal Rebrand</option>
<option>Q4 Marketing Campaign</option>
<option>Mobile App Dev</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Date Range -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-secondary block ml-2">Due Date</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-outline-variant rounded-2xl px-5 py-4 focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all font-body-md outline-none" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-secondary pointer-events-none" data-icon="event">event</span>
</div>
</div>
</div>
<!-- Asymmetric Decorative/Action Row -->
<div class="flex items-center justify-between pt-4">
<div class="hidden sm:flex items-center gap-3 px-4 py-2 bg-secondary-container/30 rounded-full border border-secondary-container">
<span class="material-symbols-outlined text-secondary text-[18px]" data-icon="info">info</span>
<span class="text-on-secondary-container text-label-sm">This will notify 4 team members.</span>
</div>
<div class="flex gap-4 w-full sm:w-auto">
<button class="flex-1 sm:flex-none px-8 py-4 font-button text-button rounded-2xl text-secondary hover:bg-surface-container-high transition-colors" type="button">Cancel</button>
<button class="flex-1 sm:flex-none px-10 py-4 font-button text-button rounded-2xl bg-primary text-on-primary shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all active:scale-95" type="submit">Create</button>
</div>
</div>
</form>
</div>

<div class="md:col-span-2 p-6 rounded-3xl bg-surface-container-low border border-outline-variant/30 flex items-center gap-6">
<div class="w-16 h-16 rounded-2xl bg-tertiary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-on-tertiary-fixed-variant text-3xl" data-icon="trending_up">trending_up</span>
</div>
<div>
<h4 class="font-h3 text-h3 text-on-surface">Momentum Check</h4>
<p class="text-on-surface-variant font-body-md">You've completed 3 milestones this month. Keep it up!</p>
</div>
</div>
<div class="p-6 rounded-3xl bg-secondary-container/20 border border-secondary-container/40 flex flex-col justify-center items-center text-center">
<span class="font-h2 text-h2 text-primary">85%</span>
<span class="text-label-sm text-secondary uppercase tracking-widest mt-1">Project Health</span>
</div>
</div>

</button>

<span class="font-manrope text-[11px] font-medium">Milestones</span>
</button>

<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-manrope text-[11px] font-medium">Account</span>
