<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface min-h-screen">
<!-- TopAppBar -->
<header class="sticky top-0 w-full z-40 px-6 py-4 flex justify-between items-center bg-white/80 dark:bg-slate-900/80 backdrop-blur-[20px] rounded-b-3xl border-b border-slate-200/50 dark:border-slate-700/50 shadow-[0_4px_12px_rgba(0,0,0,0.05)]">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-slate-500 hover:bg-slate-100/50 p-2 rounded-full transition-colors active:scale-95" data-icon="close">close</button>
<h1 class="text-lg font-extrabold text-slate-900 dark:text-slate-50 font-['Manrope'] tracking-tight">New Task</h1>
</div>
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center overflow-hidden">
<img alt="User avatar" data-alt="Close-up professional portrait of a product manager with a friendly expression, soft natural lighting, blurred office background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7TDbVJIp6iMP6Hy3xq0yBl9Njk9QbnLYMv5fAEDo-0ArTXDU7YrklWo3k84bgAwANt5MsTV3iKhVTNMpsf3_DFELjuZYhKh4mv-TXM0UCPNmLP5xonVfY0F7tnvb8YFXTm2SU_J8MuIOtgx_4UfQr-nkv0sjq5VKzLxZM4AcNo74_Em5efV2C3KtKg_rEpxcOmM8CrRi06jEXKRBgn0oGv40yYjLvE3MQvjiFBqEqY8RhpyvL2O5U6idh3zkVPVpRvrSwFXWdzw"/>
</div>
</div>
</header>
<main class="max-w-3xl mx-auto px-6 py-xl pb-32">
<div class="grid grid-cols-1 md:grid-cols-12 gap-lg">
<!-- Form Section -->
<section class="md:col-span-8 space-y-xl">
<!-- Title Field -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1">TASK TITLE</label>
<input class="w-full bg-surface-container-lowest border-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary rounded-[20px] px-lg py-md font-h2 text-h2 placeholder:text-outline-variant transition-all outline-none" placeholder="e.g. Design System Audit" type="text"/>
</div>
<!-- Description Field -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1">DESCRIPTION</label>
<textarea class="w-full bg-surface-container-lowest border-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary rounded-[20px] px-lg py-md font-body-lg text-body-lg placeholder:text-outline-variant transition-all outline-none resize-none" placeholder="Add details about this task..." rows="6"></textarea>
</div>
</section>
<!-- Metadata Section -->
<aside class="md:col-span-4 space-y-lg">
<div class="glass-panel p-lg rounded-[28px] border border-white/20 shadow-sm space-y-lg">
<!-- Project Selection -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">PROJECT</label>
<div class="flex items-center gap-3 p-md bg-surface-container-low rounded-[20px] border border-outline-variant/30 hover:border-primary/50 cursor-pointer transition-colors group">
<span class="material-symbols-outlined text-indigo-600" data-icon="folder">folder</span>
<span class="flex-1 font-body-md">Select Project</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Assignee Selection -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">ASSIGNEE</label>
<div class="flex items-center gap-3 p-md bg-surface-container-low rounded-[20px] border border-outline-variant/30 hover:border-primary/50 cursor-pointer transition-colors group">
<div class="w-6 h-6 rounded-full bg-slate-200 overflow-hidden">
<img alt="Unassigned" data-alt="Clean minimalist icon placeholder for a user avatar in a circle" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDtz4zCEenuO9XDKg9o-YPBMsQawEtuyw328-NVY6UO-dwnr2GEluBcGx83Av6cRI4b-rYmLPWhVu9tFtCaxf_JgcFdKKz0hXVgsfco59oEd-c36Pnq2YjwllPR3CZzrSiOZ05eTN12kKM2pEJB85WJOtMGx6b0baABygfW0rWZAzpGkLWbiFiY9oajJJ5kTyKhbKWDt-g_A5VmotURHf4jOmnjtXt3H2C8zFPEF0W1I_ofXhvKyAilQWCPl5YejOLaMNLK-lCOgg"/>
</div>
<span class="flex-1 font-body-md text-on-surface-variant">Assign to...</span>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="person_add">person_add</span>
</div>
</div>
<!-- Priority Selection -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">PRIORITY</label>
<div class="flex gap-2">
<button class="flex-1 py-3 rounded-[20px] border border-outline-variant/30 text-label-sm font-label-sm flex flex-col items-center gap-1 hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="low_priority">low_priority</span>
                                Low
                            </button>
<button class="flex-1 py-3 rounded-[20px] bg-primary/10 border border-primary/20 text-primary text-label-sm font-label-sm flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-[18px]" data-icon="priority_high">priority_high</span>
                                Med
                            </button>
<button class="flex-1 py-3 rounded-[20px] border border-outline-variant/30 text-label-sm font-label-sm flex flex-col items-center gap-1 hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-[18px] text-error" data-icon="emergency">emergency</span>
                                High
                            </button>
</div>
</div>
<!-- Due Date Selection -->
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant">DUE DATE</label>
<div class="flex items-center gap-3 p-md bg-surface-container-low rounded-[20px] border border-outline-variant/30 hover:border-primary/50 cursor-pointer transition-colors group">
<span class="material-symbols-outlined text-slate-500" data-icon="calendar_today">calendar_today</span>
<span class="flex-1 font-body-md">Pick a date</span>
</div>
</div>
</div>
<!-- Helper Tip -->
<div class="p-lg bg-indigo-50/50 rounded-[28px] border border-indigo-100">
<div class="flex gap-3">
<span class="material-symbols-outlined text-indigo-600" data-icon="lightbulb">lightbulb</span>
<p class="text-label-sm text-indigo-900 leading-relaxed">
                            Pro tip: You can use @mention to notify teammates directly in the description.
                        </p>
</div>
</div>
</aside>
</div>
</main>
<!-- Bottom Action Bar (Mobile & Focused Intent) -->
<footer class="fixed bottom-0 left-0 w-full z-50 p-6 flex justify-center bg-gradient-to-t from-surface via-surface to-transparent">
<button class="w-full max-w-lg bg-primary text-on-primary font-button text-button py-5 px-xl rounded-full shadow-[0_20px_50px_rgba(53,37,205,0.3)] hover:translate-y-[-2px] active:scale-95 transition-all flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="add_task">add_task</span>
            Create Task
        </button>
</footer>
<!-- BottomNavBar Suppression Check: Suppressed because this is a Focused/Transactional task page -->
</body></html>
