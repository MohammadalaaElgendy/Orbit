name: orbit
description: "Orbit is a cross-platform productivity and project management app built to organize workspaces, projects, milestones, and tasks in a simple and structured way.  It supports multiple workspaces, team collaboration, task assignment, deadlines, and nested subtasks for better workflow management.  Built with an offline-first architecture using Drift, Supabase, and PowerSync, Orbit ensures fast performance, reliable offline access, and seamless synchronization across devices.  Available on mobile and desktop with both light and dark themes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  glass: ^2.0.0+2
  google_fonts: ^7.0.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
