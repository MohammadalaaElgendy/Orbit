name: orbit
description: "Orbit is a cross-platform productivity and project management app built to organize workspaces, projects, milestones, and tasks in a simple and structured way.  It supports multiple workspaces, team collaboration, task assignment, deadlines, and nested subtasks for better workflow management.  Built with an offline-first architecture using Drift, Supabase, and PowerSync, Orbit ensures fast performance, reliable offline access, and seamless synchronization across devices.  Available on mobile and desktop with both light and dark themes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  glass: ^2.0.0+2
  google_fonts: ^7.0.0
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  rxdart: ^0.28.0
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.3.3
  image_picker: ^1.2.2
  supabase_flutter: ^2.8.3
  google_sign_in: ^6.2.2
  file_picker: ^8.1.7
  app_links: ^7.0.0
  image: ^4.3.0
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: 17.2.3
  timezone: 0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  drift_dev: ^2.14.1
  build_runner: ^2.4.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#1E0B9B" # Premium purple base
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  monochrome_android_icon: "assets/icons/app_icon_monochrome.png"
  min_sdk_android: 21 # android min sdk min:16, default:21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#1E0B9B"
    theme_color: "#1E0B9B"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256 # min:48, default:48
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icons/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/auth/
    - assets/images/workspaces/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
